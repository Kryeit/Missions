plugins {
    id 'java'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.createmod.net' }        // Create, Ponder, Flywheel, Catnip
    maven { url = 'https://maven.ithundxr.dev/snapshots' } // Registrate
}

neoForge {
    version = neo_version

    // We ship a server-side-only mod that adds no registry objects, so AT validation is harmless.
    validateAccessTransformers = true

    runs {
        // A dedicated server is the real target.
        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            gameDirectory = file('run')
        }
        // Kept only so the server-opened vanilla GUIs can be smoke-tested with a local client.
        client {
            client()
            systemProperty 'forge.logging.console.level', 'debug'
            gameDirectory = file('run')
        }
    }

    mods {
        "$mod_id" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Create + ecosystem (NeoForge 1.21.1). Coordinates per the Create wiki.
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    // LuckPerms is an optional runtime integration; compile against the API only.
    compileOnly("net.luckperms:api:${luckperms_version}")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Expand mod metadata templates (neoforge.mods.toml, pack.mcmeta) with gradle properties.
final def expansionProps = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        create_version_range   : create_version_range,
        luckperms_version      : luckperms_version,
]

final def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    inputs.properties(expansionProps)
    expand(expansionProps)
    from('src/main/templates')
    into("${layout.buildDirectory.get().asFile}/generated/sources/modMetadata")
}
sourceSets.main.resources.srcDir(generateModMetadata)
neoForge.ideSyncTask(generateModMetadata)

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven { url = "file://${project.projectDir}/repo" }
    }
}
